name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Check the Cursor rule matches AGENTS.MD
        run: |
          scripts/test-cursor-rule
          scripts/cursor-rule --check

      - name: Test published PR head checks
        run: python3 scripts/test-pr-head-check.py

      - name: Test issue triage (offline, synthetic)
        run: python3 scripts/test-issue-triage.py

      - name: Test agent leftover sweep (offline, synthetic)
        run: python3 scripts/test-agent-sweep.py

      - name: Test agent sweep schedule (offline, synthetic)
        run: scripts/test-agent-sweep-schedule

      - name: Test T3 settings sync (offline, synthetic)
        run: python3 scripts/test-t3-settings-sync.py

      - name: Test agent locations installer (offline, synthetic HOME)
        run: scripts/test-agent-locations

      - name: Test Claude worktree hook (offline, synthetic)
        run: python3 hooks/test-claude-worktree.py

      - name: Test reusable baseline (offline, consumer fixtures)
        run: python3 scripts/test-baseline.py

      - name: Test Codex output filtering (offline, synthetic)
        run: python3 hooks/codex/test-output-scrub.py

      - name: Build browser helper
        run: |
          bun install --frozen-lockfile
          bun build scripts/browser-tools.ts --compile --target bun --outfile /tmp/browser-tools
          /tmp/browser-tools --help

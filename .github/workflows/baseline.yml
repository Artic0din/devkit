name: Reusable repository baseline
on:
  workflow_call:
    inputs:
      required-files:
        description: Comma-separated repository-relative files required by this project
        type: string
        default: README.md, LICENSE, .gitignore, AGENTS.md
      forbidden-paths:
        description: Comma-separated paths a pull request must not add or change; a name without a slash matches at any depth
        type: string
        default: node_modules
permissions:
  contents: read
jobs:
  baseline:
    name: Repository baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out caller
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate required files
        env:
          REQUIRED_FILES: ${{ inputs.required-files }}
        run: |
          python3 -I - <<'PY'
          import os
          from pathlib import Path

          paths = [entry.strip() for entry in os.environ["REQUIRED_FILES"].split(",") if entry.strip()]
          if not paths:
              raise SystemExit("required-files must include at least one path")
          root = Path.cwd().resolve()
          invalid, missing = [], []
          errors = []
          for path in paths:
              candidate = Path(path)
              if candidate.is_absolute():
                  invalid.append(path)
                  continue
              try:
                  resolved = candidate.resolve()
              except (OSError, RuntimeError) as error:
                  errors.append(f"Cannot resolve required path {path!r}: {error}")
                  continue
              if not resolved.is_relative_to(root):
                  invalid.append(path)
              elif not candidate.exists():
                  missing.append(path)
          if invalid:
              errors.append(f"Required paths must be relative and stay within the checkout: {invalid!r}")
          if missing:
              errors.append(f"Required paths do not exist: {missing!r}")
          if errors:
              raise SystemExit("\n".join(errors))
          print(f"Validated {len(paths)} required paths")
          PY
  pr-hygiene:
    name: Pull request hygiene
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    timeout-minutes: 5
    steps:
      - name: Check out caller
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: List the pull request's commits
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: >-
          gh api --paginate "repos/$REPOSITORY/pulls/$NUMBER/commits"
          --jq '.[] | {sha, login: (.author.login // ""), parents: (.parents | length), message: .commit.message}'
          > "$RUNNER_TEMP/commits.jsonl"
      - name: Check title, commits, attribution and paths
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          FORBIDDEN: ${{ inputs.forbidden-paths }}
          COMMITS_FILE: ${{ runner.temp }}/commits.jsonl
          TOTAL_COMMITS: ${{ github.event.pull_request.commits }}
        run: |
          python3 -I - <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          env = os.environ
          conventional = re.compile(r"^(feat|fix|test|refactor|perf|docs|style|chore|ci|build|revert)(\([^)]+\))?!?: \S")
          # Human co-author trailers stay allowed; only agent identities and agent footers count.
          agent = re.compile(
              r"Co-Authored-By:[^\n<]*<[^>\n]*(@anthropic\.com|@openai\.com|@cursor\.com|Copilot@users\.noreply\.github\.com|\[bot\]@users\.noreply\.github\.com)>"
              r"|Co-Authored-By:[^\n]*\b(Claude (Opus|Sonnet|Haiku|Fable)|GPT-\d|Kimi K\d|Gemini \d)"
              r"|Generated with \[|^Created with |^Made with \[|responding on behalf of",
              re.IGNORECASE | re.MULTILINE,
          )
          disclosure = re.compile(
              r"\b(AI|LLM|agent|model|Copilot|machine[- ]generated)\b[^\n]{0,80}\b(disclos|assist|generat|attribut|co-author)"
              r"|\bdisclos\w*[^\n]{0,80}\b(AI|LLM|agent|model|tool)",
              re.IGNORECASE,
          )

          def git(*arguments):
              return subprocess.run(["git", *arguments], capture_output=True, text=True, check=True).stdout

          def templates():
              found = []
              for directory in (Path("."), Path(".github"), Path("docs")):
                  if not directory.is_dir():
                      continue
                  for entry in directory.iterdir():
                      name = entry.name.lower()
                      if entry.is_file() and name == "pull_request_template.md":
                          found.append(entry)
                      elif entry.is_dir() and name == "pull_request_template":
                          found.extend(child for child in entry.iterdir() if child.suffix.lower() == ".md")
              return found

          errors = []
          bot = env["AUTHOR"].endswith("[bot]")
          commits = [json.loads(line) for line in Path(env["COMMITS_FILE"]).read_text().splitlines() if line.strip()]
          # Synced upstream commits keep their own style; only the pull request author's commits are checked.
          own = [c for c in commits if c["login"] == env["AUTHOR"] and c.get("parents", 1) < 2]
          if len(commits) < int(env.get("TOTAL_COMMITS") or 0):
              # GitHub lists at most 250 commits; match the rest by the author's emails from the listed ones.
              history = {}
              for record in git("log", "--format=%H%x00%ae%x00%P%x00%B%x1e", f"{env['BASE']}..{env['HEAD']}").split("\x1e"):
                  if record.strip():
                      sha, email, parents, message = record.lstrip("\n").split("\0", 3)
                      history[sha] = (email, len(parents.split()), message)
              emails = {history[c["sha"]][0] for c in own if c["sha"] in history}
              listed = {c["sha"] for c in commits}
              own += [{"sha": sha, "message": message} for sha, (email, parents, message) in history.items()
                      if sha not in listed and email in emails and parents < 2]
          if not bot:
              if not conventional.match(env["TITLE"]):
                  errors.append(f"Title is not a conventional commit: {env['TITLE']!r}")
              for commit in own:
                  headline = commit["message"].splitlines()[0] if commit["message"] else ""
                  if not conventional.match(headline) and not headline.startswith('Revert "'):
                      errors.append(f"Commit {commit['sha'][:8]} is not a conventional commit: {headline!r}")
              required_by = [str(path) for path in templates() if disclosure.search(path.read_text(errors="replace"))]
              if required_by:
                  print(f"Agent attribution allowed: AI disclosure is required by {', '.join(required_by)}")
              else:
                  texts = [("Pull request body", env.get("BODY") or "")]
                  texts += [(f"Commit {c['sha'][:8]}", c["message"]) for c in own]
                  for label, text in texts:
                      match = agent.search(text)
                      if match:
                          errors.append(f"{label} carries agent attribution: {match.group(0)!r}")
          changed = []
          # NUL-separated output avoids Git's quoting of unusual filenames; R and C records carry two paths.
          fields = iter(git("diff", "-z", "--name-status", f"{env['BASE']}...{env['HEAD']}").split("\0"))
          for status in fields:
              if not status:
                  continue
              path = next(fields)
              if status[:1] in "RC":
                  path = next(fields)
              if status[:1] in "AMRCT":
                  changed.append(path)
          for entry in env["FORBIDDEN"].split(","):
              forbidden = entry.strip().strip("/")
              if not forbidden:
                  continue
              hits = [
                  path for path in changed
                  if path == forbidden or path.startswith(forbidden + "/")
                  or ("/" not in forbidden and f"/{forbidden}/" in f"/{path}/")
              ]
              if hits:
                  errors.append(f"Changes forbidden path {forbidden}: {hits[:3]}")
          if errors:
              raise SystemExit("\n".join(errors))
          print("Pull request hygiene passed")
          PY

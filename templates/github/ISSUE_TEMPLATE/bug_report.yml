name: Bug report
description: Report broken behaviour, a regression, a crash, or a reliability problem.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Keep the report to one problem.
        Search existing issues first; if one matches, add your evidence there instead.
        Do not open a public issue for a vulnerability. Use this repository's Security tab or `SECURITY.md`.
        Remove API keys, tokens, passwords, private URLs, and home-directory paths from everything you paste.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: I removed secrets and private data from this report.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: What went wrong
      description: A clear description of the problem.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal, deterministic steps. Say how often it happens if it is intermittent.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true

  - type: dropdown
    id: impact
    attributes:
      label: Impact
      options:
        - Blocks work completely
        - Major degradation or frequent failure
        - Minor bug or occasional failure
        - Cosmetic issue
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Version or commit, operating system, device, browser, runtime, and any service the problem depends on.
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Logs or evidence
      description: The most relevant log lines, error text, or event IDs only. Redact secrets.
      render: shell

  - type: textarea
    id: workaround
    attributes:
      label: Workaround
      description: Anything that temporarily avoids the problem.

  - type: textarea
    id: related
    attributes:
      label: Related issues
      description: Similar issues, and why this one is different.
